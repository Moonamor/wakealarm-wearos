<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WakeAlarm</title>
<style>
  :root { color-scheme: dark; --y:#FFD600; --red:#da3633; --teal:#26a69a; --amber:#ffb300; --bg:#0b0f14; --card:#161b22; --line:#30363d; --mut:#8b949e; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--bg); color:#e6edf3;
         font-family:-apple-system,"Segoe UI",Tahoma,sans-serif; padding:16px; }
  .card { width:100%; max-width:440px; background:var(--card); border:1px solid var(--line); border-radius:18px; padding:22px; }
  h1 { margin:0 0 6px; font-size:22px; text-align:center; display:flex; align-items:center; justify-content:center; gap:10px; }
  h1 .logo { width:34px; height:34px; border-radius:9px; background:var(--y); display:inline-grid; place-items:center; color:#000; font-size:18px; }
  .sub { text-align:center; color:var(--mut); font-size:12px; margin-bottom:14px; }
  label { display:block; font-size:13px; color:var(--mut); margin:12px 0 6px; }
  input, textarea { width:100%; padding:12px 14px; font-size:16px; border-radius:10px; border:1px solid var(--line); background:#0d1117; color:#e6edf3; }
  textarea { resize:vertical; min-height:64px; }
  input:focus, textarea:focus { outline:none; border-color:#58a6ff; }
  #key, #link, #phone { direction:ltr; text-align:left; }
  .seg { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; }
  .seg input { display:none; }
  .seg label { margin:0; padding:11px 6px; text-align:center; border:1px solid var(--line); border-radius:10px; cursor:pointer; color:#e6edf3; font-size:14px; }
  .seg input:checked + label { border-color:transparent; font-weight:700; }
  #l-soft:checked + label { background:var(--teal); color:#fff; }
  #l-normal:checked + label { background:var(--red); color:#fff; }
  #l-urgent:checked + label { background:var(--amber); color:#000; }
  .row { display:flex; align-items:center; justify-content:space-between; margin-top:14px; padding:12px 14px; background:#0d1117; border:1px solid var(--line); border-radius:10px; }
  .switch { position:relative; width:46px; height:26px; }
  .switch input { display:none; }
  .switch span { position:absolute; inset:0; background:#30363d; border-radius:26px; transition:.2s; }
  .switch span::before { content:""; position:absolute; width:20px; height:20px; left:3px; top:3px; background:#fff; border-radius:50%; transition:.2s; }
  .switch input:checked + span { background:var(--y); }
  .switch input:checked + span::before { transform:translateX(20px); }
  details { margin-top:12px; } summary { cursor:pointer; color:var(--mut); font-size:13px; }
  button { width:100%; margin-top:18px; padding:18px; font-size:20px; font-weight:800; border:0; border-radius:12px; background:var(--y); color:#000; cursor:pointer; }
  button:active { transform:scale(.98); } button:disabled { opacity:.6; }
  #status { margin-top:14px; min-height:22px; text-align:center; font-size:14px; }
  .ok { color:#3fb950; } .err { color:#f85149; }
  .url { margin-top:10px; font-size:11px; color:var(--mut); direction:ltr; text-align:left; word-break:break-all; }
</style>
</head>
<body>
<div class="card">
  <h1><span class="logo">🔔</span>WakeAlarm</h1>
  <div class="sub">أرسل تنبيهاً إلى الساعة من أي مكان</div>

  <label>الرسالة التي تظهر على الساعة</label>
  <textarea id="msg">استيقظ!</textarea>

  <label>الشدة</label>
  <div class="seg">
    <input type="radio" name="level" id="l-soft" value="soft"><label for="l-soft">🌙 هادئ</label>
    <input type="radio" name="level" id="l-normal" value="normal" checked><label for="l-normal">🔔 عادي</label>
    <input type="radio" name="level" id="l-urgent" value="urgent"><label for="l-urgent">🚨 طارئ</label>
  </div>

  <div class="row">
    <span>📢 صفارة إنذار (صوت عالٍ)</span>
    <label class="switch"><input type="checkbox" id="siren"><span></span></label>
  </div>

  <details>
    <summary>أزرار إضافية على الساعة (اختياري)</summary>
    <label>رقم هاتف — يظهر زر «اتصال»</label>
    <input id="phone" placeholder="+9665XXXXXXXX" inputmode="tel">
    <label>رابط — يظهر زر «فتح على الجوال»</label>
    <input id="link" placeholder="https://…">
  </details>

  <details>
    <summary>المفتاح السري</summary>
    <label>WAKE_KEY</label>
    <input id="key" placeholder="••••••" autocomplete="off">
  </details>

  <button id="send">🔔 أرسل للساعة</button>
  <div id="status"></div>
  <div class="url" id="url"></div>
</div>

<script>
const $ = id => document.getElementById(id);
const level = () => document.querySelector('input[name=level]:checked').value;

// remember inputs
const fields = ['key','msg','phone','link'];
try { fields.forEach(f => { const v = localStorage.getItem('wake_'+f); if (v !== null) $(f).value = v; });
      const lv = localStorage.getItem('wake_level'); if (lv) $('l-'+lv).checked = true;
      $('siren').checked = localStorage.getItem('wake_siren') === '1'; } catch(e) {}

// siren follows level unless the user touched it
let sirenTouched = false;
$('siren').addEventListener('change', () => { sirenTouched = true; preview(); });
document.querySelectorAll('input[name=level]').forEach(r => r.addEventListener('change', () => {
  if (!sirenTouched) $('siren').checked = level() === 'urgent';
  preview();
}));
[...fields.map($), ].forEach(el => el.addEventListener('input', preview));

function params() {
  const p = new URLSearchParams();
  p.set('key', $('key').value.trim());
  p.set('msg', $('msg').value.trim() || 'استيقظ!');
  p.set('level', level());
  p.set('siren', $('siren').checked ? '1' : '0');
  if ($('phone').value.trim()) p.set('phone', $('phone').value.trim());
  if ($('link').value.trim()) p.set('link', $('link').value.trim());
  return p;
}
function preview() {
  const p = params(); if (p.get('key')) p.set('key', '•••');
  $('url').textContent = location.origin + '/alert?' + p.toString();
}
preview();

$('send').addEventListener('click', async () => {
  const key = $('key').value.trim();
  if (!key) { $('status').className = 'err'; $('status').textContent = 'أدخل المفتاح السري (في الأسفل)'; return; }
  try { fields.forEach(f => localStorage.setItem('wake_'+f, $(f).value));
        localStorage.setItem('wake_level', level()); localStorage.setItem('wake_siren', $('siren').checked ? '1':'0'); } catch(e) {}

  $('send').disabled = true; $('status').className = ''; $('status').textContent = 'جارٍ الإرسال…';
  try {
    const body = { msg: $('msg').value.trim(), level: level(), siren: $('siren').checked };
    if ($('phone').value.trim()) body.phone = $('phone').value.trim();
    if ($('link').value.trim()) body.link = $('link').value.trim();
    const r = await fetch('/alert', { method: 'POST', headers: { 'content-type': 'application/json', 'x-key': key }, body: JSON.stringify(body) });
    const j = await r.json();
    if (r.ok) { $('status').className = 'ok'; $('status').textContent = '✅ أُرسلت: ' + j.sent.msg + (j.sent.siren === '1' ? ' 📢' : ''); }
    else { $('status').className = 'err'; $('status').textContent = '❌ ' + (j.error || r.status); }
  } catch (e) { $('status').className = 'err'; $('status').textContent = '❌ فشل الاتصال'; }
  finally { $('send').disabled = false; }
});
</script>
</body>
</html>
