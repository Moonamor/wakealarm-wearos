name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      WAKE_BACKEND_URL: ${{ vars.WAKE_BACKEND_URL }}
      WAKE_KEY: ${{ secrets.WAKE_KEY }}
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }

      # Firebase config from the GOOGLE_SERVICES_JSON secret (paste the raw file content).
      - name: Write google-services.json
        if: ${{ env.GOOGLE_SERVICES_JSON != '' }}
        run: printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json

      - name: Check configuration
        run: |
          [ -f app/google-services.json ] && echo "✅ google-services.json present" || echo "⚠️  google-services.json MISSING — FCM will not work in this APK"
          [ -n "$WAKE_BACKEND_URL" ] && echo "✅ WAKE_BACKEND_URL=$WAKE_BACKEND_URL" || echo "⚠️  WAKE_BACKEND_URL not set (repo Variable)"
          [ -n "$WAKE_KEY" ] && echo "✅ WAKE_KEY set" || echo "⚠️  WAKE_KEY not set (repo Secret)"

      - name: Build
        id: build
        continue-on-error: true
        run: gradle assembleDebug --console=plain 2>&1 | tee build.log; exit ${PIPESTATUS[0]}

      - name: Report errors as issue
        if: steps.build.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo '```'; grep -aE "^e: |error:|What went wrong|Unresolved|Could not|AAPT|ERROR|FAILURE|> Task .* FAILED" build.log | head -80; echo; echo "--- tail ---"; tail -40 build.log; echo '```'; } > body.md
          gh issue create --title "Build failed: ${GITHUB_SHA::7}" --body-file body.md --label ci-failure 2>/dev/null || gh issue create --title "Build failed: ${GITHUB_SHA::7}" --body-file body.md
          exit 1

      - uses: actions/upload-artifact@v4
        with: { name: WakeAlarm-apk, path: app/build/outputs/apk/debug/app-debug.apk }
