<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WakeAlarm Remote</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:#0b0f14; color:#e6edf3; font-family:-apple-system,"Segoe UI",Tahoma,sans-serif; padding:16px; }
  .card { width:100%; max-width:420px; background:#161b22; border:1px solid #30363d; border-radius:16px; padding:24px; }
  h1 { margin:0 0 20px; font-size:22px; text-align:center; }
  label { display:block; font-size:14px; color:#8b949e; margin:14px 0 6px; }
  input { width:100%; padding:14px; font-size:18px; border-radius:10px; border:1px solid #30363d;
          background:#0d1117; color:#e6edf3; direction:ltr; text-align:left; }
  input:focus { outline:none; border-color:#58a6ff; }
  button { width:100%; margin-top:22px; padding:20px; font-size:22px; font-weight:700; border:0; border-radius:12px;
           background:#da3633; color:#fff; cursor:pointer; }
  button:active { transform:scale(.98); }
  button:disabled { opacity:.6; }
  #status { margin-top:16px; min-height:24px; text-align:center; font-size:15px; }
  .ok { color:#3fb950; } .err { color:#f85149; }
  .url { margin-top:10px; font-size:12px; color:#8b949e; direction:ltr; text-align:left; word-break:break-all; }
</style>
</head>
<body>
<div class="card">
  <h1>⌚ WakeAlarm</h1>

  <label>IP الساعة (يظهر على شاشة الساعة)</label>
  <input id="ip" placeholder="192.168.1.50" inputmode="decimal">

  <label>الرسالة / القيمة (يجب أن تكون WAKE)</label>
  <input id="value" value="WAKE">

  <button id="send">🔔 أيقظ الساعة</button>
  <div id="status"></div>
  <div class="url" id="url"></div>
</div>

<script>
const $ = id => document.getElementById(id);
const PORT = 8080;

try { $('ip').value = localStorage.getItem('wake_ip') || ''; } catch(e) {}
try { $('value').value = localStorage.getItem('wake_value') || 'WAKE'; } catch(e) {}

function buildUrl() {
  const ip = $('ip').value.trim();
  const v  = $('value').value.trim();
  return `http://${ip}:${PORT}/alert?value=${encodeURIComponent(v)}`;
}
function refreshUrl() { $('url').textContent = $('ip').value.trim() ? buildUrl() : ''; }
$('ip').addEventListener('input', refreshUrl);
$('value').addEventListener('input', refreshUrl);
refreshUrl();

$('send').addEventListener('click', async () => {
  const ip = $('ip').value.trim();
  if (!ip) { $('status').className='err'; $('status').textContent='أدخل IP الساعة أولاً'; return; }
  try { localStorage.setItem('wake_ip', ip); localStorage.setItem('wake_value', $('value').value.trim()); } catch(e) {}

  $('send').disabled = true;
  $('status').className=''; $('status').textContent='جارٍ الإرسال…';
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), 6000);
  try {
    // no-cors: الساعة لا ترسل CORS headers، لكن الطلب يصل وينفَّذ
    await fetch(buildUrl(), { mode:'no-cors', cache:'no-store', signal: ctrl.signal });
    $('status').className='ok'; $('status').textContent='✅ وصل الطلب للساعة — يفترض أنها تهتز الآن';
  } catch (e) {
    $('status').className='err';
    $('status').textContent = e.name==='AbortError'
      ? '⏱ انتهى الوقت: تأكد أن الساعة على نفس الـ Wi-Fi والتطبيق مفتوح'
      : '❌ فشل الاتصال: تحقق من الـ IP أو افتح التطبيق على الساعة';
  } finally { clearTimeout(t); $('send').disabled = false; }
});
</script>
</body>
</html>
